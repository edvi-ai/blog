{{- $image := .Get "image" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" | default "" -}}
{{- $width := .Get "width" | default "500px" -}}
{{- $url := .Get "url" | default "" -}}
<figure style="width: 100%; display: flex; flex-direction: column; justify-content: center; margin: 30px 0;">
    <div style="display: flex; justify-content: center;">
        {{- if $url -}}
        <a href="{{ $url }}">
            <img src="{{ $image }}" alt="{{ $alt }}" style="max-width: {{ $width }}; height: auto;" />
        </a>
        {{- else -}}
        <img src="{{ $image }}" alt="{{ $alt }}" style="max-width: {{ $width }}; height: auto;" />
        {{- end -}}
    </div>
    {{- if $caption -}}
    <figcaption style="margin-top: 0.5em; font-size: 0.9em; color: #666; font-style: italic; text-align: center;">
        {{ $caption | markdownify }}
    </figcaption>
    {{- end -}}
</figure>
<style>
    @media (prefers-color-scheme: dark) {
        figure figcaption {
            color: #999;
        }
    }
</style>

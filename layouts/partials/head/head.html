<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="/images/favicon.svg">
    {{ $style := resources.Get "scss/global.scss" | toCSS | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
    {{ $prism := resources.Get "css/prism.css" }}
    <link rel="stylesheet" href="{{ $prism.RelPermalink }}" />
    <!-- Google Fonts: Source Serif 4 (replacing Merriweather) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">
    {{ partial "seo/print.html" . }}
    {{ with .Params.forestry_instant_preview_id }}
    {{- safeHTML (printf "<meta property='forestry_instant_preview_id' content='%s'>" .) -}}
    {{ end -}}
    <!-- Font overrides - loaded after theme CSS to ensure they take precedence -->
    <style>
        :root {
            --serif: "Source Serif 4", Georgia, Cambria, "Times New Roman", Times, serif;
            --sanserif: "Source Serif 4", Georgia, Cambria, "Times New Roman", Times, serif;
        }

        body {
            --serif: "Source Serif 4", Georgia, Cambria, "Times New Roman", Times, serif;
            --sanserif: "Source Serif 4", Georgia, Cambria, "Times New Roman", Times, serif;
        }

        p {
            font-family: "Source Serif 4", Georgia, Cambria, "Times New Roman", Times, serif !important;
        }
    </style>
</head>
